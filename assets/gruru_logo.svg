<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <linearGradient id="logoGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5A1F" />
      <stop offset="50%" stop-color="#8C6BFF" />
      <stop offset="100%" stop-color="#2EE6FF" />
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Emblem Icon: Future Archaeology Monogram -->
  <g transform="translate(15, 12)">
    <!-- Outer Relic Hexagon Frame -->
    <polygon points="48,4 88,28 88,68 48,92 8,68 8,28" 
             stroke="#2C2C3A" stroke-width="2" fill="#17171F" />
    <polygon points="48,10 82,31 82,65 48,86 14,65 14,31" 
             stroke="#2EE6FF" stroke-width="1.5" stroke-dasharray="6 3" fill="none" opacity="0.7" />
    
    <!-- Central Quantum Core / Archaeologist Eye -->
    <circle cx="48" cy="48" r="16" fill="#0B0B0F" stroke="#D7FF3A" stroke-width="2.5" filter="url(#neonBlur)"/>
    <circle cx="48" cy="48" r="6" fill="#D7FF3A" />
    
    <!-- Archaeological Crosshairs & Data Nodes -->
    <line x1="48" y1="12" x2="48" y2="26" stroke="#D7FF3A" stroke-width="2" />
    <line x1="48" y1="70" x2="48" y2="84" stroke="#D7FF3A" stroke-width="2" />
    <line x1="16" y1="48" x2="26" y2="48" stroke="#FF5A1F" stroke-width="2" />
    <line x1="70" y1="48" x2="80" y2="48" stroke="#FF5A1F" stroke-width="2" />

    <!-- Corner Constellation Dots -->
    <circle cx="48" cy="4" r="3" fill="#D7FF3A" />
    <circle cx="88" cy="28" r="3" fill="#2EE6FF" />
    <circle cx="88" cy="68" r="3" fill="#8C6BFF" />
    <circle cx="48" cy="92" r="3" fill="#FF5A1F" />
    <circle cx="8" cy="68" r="3" fill="#8C6BFF" />
    <circle cx="8" cy="28" r="3" fill="#2EE6FF" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(125, 26)">
    <!-- Main Title: GRURU -->
    <text x="0" y="44" font-family="'Chakra Petch', 'Orbitron', 'Inter', sans-serif" font-weight="900" font-size="46" fill="#F2EDE3" letter-spacing="4">
      GRURU
    </text>
    <text x="180" y="44" font-family="'Chakra Petch', 'Orbitron', 'Inter', sans-serif" font-weight="400" font-size="34" fill="#D7FF3A" letter-spacing="6">
      MUSEUM
    </text>

    <!-- Subtitle Specimen Tag -->
    <g transform="translate(2, 64)">
      <rect x="0" y="0" width="220" height="18" fill="#17171F" stroke="#2C2C3A" stroke-width="1" rx="2" />
      <text x="8" y="13" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#8A8A9E" letter-spacing="1.5">
        SPECIMEN ARCHIVE // LAB-01
      </text>
      
      <circle cx="206" cy="9" r="3.5" fill="#34E89E" />
      
      <text x="235" y="13" font-family="'IBM Plex Sans Thai', sans-serif" font-size="11" fill="#FF5A1F" font-weight="600" letter-spacing="0.5">
        พิพิธภัณฑ์ความรู้ดิจิทัล
      </text>
    </g>
  </g>

  <!-- Right Decorative Coordinate Bracket -->
  <g transform="translate(435, 30)" opacity="0.6">
    <path d="M 15 0 L 30 0 L 30 50 L 15 50" stroke="#D7FF3A" stroke-width="1.5" fill="none" />
    <text x="2" y="28" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#D7FF3A" transform="rotate(90, 2, 28)">
      FUTURE
    </text>
  </g>
</svg>
